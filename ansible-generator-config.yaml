collections:
  - namespace: waldur
    name: structure
    version: 1.0.0
    modules:
      - name: project
        plugin: crud
        operations:
          list: projects_list
          create: projects_create
          destroy: projects_destroy
        resolvers:
          customer:
            list: customers_list
            retrieve: customers_retrieve
          type:
            list: project_types_list
            retrieve: project_types_retrieve
      - name: customer
        plugin: crud
        operations:
          list: customers_list
          create: customers_create
          destroy: customers_destroy
        skip_resolver_check:
          - homepage
  - namespace: waldur
    name: openstack
    version: 1.0.0
    modules:
      - name: instance_facts
        plugin: facts
        list_operation: openstack_instances_list
        retrieve_operation: openstack_instances_retrieve
      - name: security_group_facts
        plugin: facts
        list_operation: openstack_security_groups_list
        retrieve_operation: openstack_security_groups_retrieve
        many: true
        context_params:
          - name: tenant
            resolver:
              list: openstack_tenants_list
              retrieve: openstack_tenants_retrieve
              filter_key: tenant_uuid
      - name: subnet_facts
        plugin: facts
        list_operation: openstack_subnets_list
        retrieve_operation: openstack_subnets_retrieve
        many: true
        context_params:
          - name: tenant
            resolver:
              list: openstack_tenants_list
              retrieve: openstack_tenants_retrieve
              filter_key: tenant_uuid
      - name: vpc
        plugin: order
        offering_type: OpenStack.Tenant
        description: Create, update, or delete an OpenStack Tenant via the marketplace.
        resource_type: OpenStack tenant
        has_limits: true
        existence_check_op: openstack_tenants_list
      - name: volume
        plugin: order
        offering_type: OpenStack.Volume
        description: Create, update, or delete an OpenStack Volume via the marketplace.
        resource_type: OpenStack volume

        existence_check_op: openstack_volumes_list
        update_op: openstack_volumes_update
        update_check_fields:
          - description

        resolvers:
          type:
            list: openstack_volume_types_list
            retrieve: openstack_volume_types_retrieve
            filter_by:
              - source_param: "offering"
                source_key: "scope_uuid"
                target_key: "tenant_uuid"
          image:
            list: openstack_images_list
            retrieve: openstack_images_retrieve
            filter_by:
              - source_param: "offering"
                source_key: "scope_uuid"
                target_key: "tenant_uuid"
          availability_zone:
            list: openstack_volume_availability_zones_list
            retrieve: openstack_volume_availability_zones_retrieve
            filter_by:
              - source_param: "offering"
                source_key: "scope_uuid"
                target_key: "tenant_uuid"
      - name: instance
        plugin: order
        offering_type: OpenStack.Instance

        description: "Create or delete an OpenStack Instance."
        resource_type: "OpenStack instance"

        existence_check_op: "openstack_instances_list"

        resolvers:
          flavor:
            list: "openstack_flavors_list"
            retrieve: "openstack_flavors_retrieve"
            filter_by:
              - source_param: "offering"
                source_key: "scope_uuid"
                target_key: "tenant_uuid"
          image:
            list: "openstack_images_list"
            retrieve: "openstack_images_retrieve"
            filter_by:
              - source_param: "offering"
                source_key: "scope_uuid"
                target_key: "tenant_uuid"
          system_volume_type:
            list: "openstack_volume_types_list"
            retrieve: "openstack_volume_types_retrieve"
            filter_by:
              - source_param: "offering"
                source_key: "scope_uuid"
                target_key: "tenant_uuid"
          data_volume_type:
            list: "openstack_volume_types_list"
            retrieve: "openstack_volume_types_retrieve"
            filter_by:
              - source_param: "offering"
                source_key: "scope_uuid"
                target_key: "tenant_uuid"
          ssh_key:
            list: "keys_list"
            retrieve: "keys_retrieve"
      - name: security_group
        plugin: crud
        resource_type: "OpenStack security group"
        description: "Manage OpenStack Security Groups and their rules in Waldur."

        operations:
          create: "openstack_tenants_create_security_group"
          list: "openstack_security_groups_list"
          destroy: "openstack_security_groups_destroy"
          update: "openstack_security_groups_partial_update"

        update_config:
          fields:
            - "name"
            - "description"
          actions:
            set_rules:
              operation: "openstack_security_groups_set_rules"
              param: "rules"

        path_param_maps:
          create:
            uuid: "tenant"

        resolvers:
          tenant:
            list: "openstack_tenants_list"
            retrieve: "openstack_tenants_retrieve"
            error_message: "Tenant '{value}' not found."
      - name: network
        plugin: crud
        resource_type: "OpenStack network"
        description: "Manage OpenStack Networks in Waldur."
        operations:
          create: "openstack_tenants_create_network"
          list: "openstack_networks_list"
          destroy: "openstack_networks_destroy"
          update: "openstack_networks_partial_update"
        update_config:
          fields:
            - "name"
            - "description"
        path_param_maps:
          create:
            uuid: "tenant"
        resolvers:
          tenant:
            list: "openstack_tenants_list"
            retrieve: "openstack_tenants_retrieve"
            error_message: "Tenant '{value}' not found."
      - name: server_group
        plugin: crud
        resource_type: "OpenStack server group"
        description: "Manage OpenStack Server Groups (Affinity Groups) in Waldur."
        operations:
          create: "openstack_tenants_create_server_group"
          list: "openstack_server_groups_list"
          destroy: "openstack_server_groups_destroy"
          update: "openstack_server_groups_partial_update"
        update_config:
          fields:
            - "name"
            - "description"
        path_param_maps:
          create:
            uuid: "tenant"
        resolvers:
          tenant:
            list: "openstack_tenants_list"
            retrieve: "openstack_tenants_retrieve"
            error_message: "Tenant '{value}' not found."
      - name: floating_ip
        plugin: crud
        resource_type: "OpenStack floating IP"
        description: "Manage OpenStack Floating IPs in Waldur."
        operations:
          create: "openstack_tenants_create_floating_ip"
          list: "openstack_floating_ips_list"
          destroy: "openstack_floating_ips_destroy"
          update: "openstack_floating_ips_partial_update"
        update_config:
          fields:
            - "description"
        path_param_maps:
          create:
            uuid: "tenant"
        resolvers:
          tenant:
            list: "openstack_tenants_list"
            retrieve: "openstack_tenants_retrieve"
            error_message: "Tenant '{value}' not found."
