- name: show_resources_uses_tool
  description: Explicit data requests should use appropriate tool
  inputs:
    - "show my resources"
  evaluations:
    - type: tool_usage
      config:
        expected_tool: "display_user_resources"
        rationale: "User is explicitly requesting their resource data"

