- name: greeting_no_tool
  description: Greetings should not trigger tool calls
  inputs:
    - "hello"
  evaluations:
    - type: tool_usage
      config:
        expected_tool: null
        rationale: "Greetings should be answered directly without using tools"

- name: question_no_tool
  description: Conceptual questions should be answered directly
  inputs:
    - "what are resources?"
  evaluations:
    - type: tool_usage
      config:
        expected_tool: null
        rationale: "Conceptual questions should be answered from knowledge, not tools"

- name: help_no_tool
