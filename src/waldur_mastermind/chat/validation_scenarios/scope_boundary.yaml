- name: off_topic_programming
  description: Programming questions unrelated to Waldur should be declined
  inputs:
    - "how to calculate factorial in Rust"
  evaluations:
    - type: pattern
      config:
        forbidden_patterns:
          - "```rust"
          - "fn factorial"
        required_patterns:
          - "(?i)(waldur|outside|can.t help)"
        rationale: "Off-topic programming requests should be declined with Waldur redirect"
    - type: tool_usage
      config:
        expected_tool: null
        rationale: "Off-topic requests should never trigger tools"

- name: off_topic_general_knowledge
  description: General knowledge questions should be declined
  inputs:
    - "tell me about pizza"
  evaluations:
    - type: pattern
      config:
        forbidden_patterns:
          - "(?i)(pizza|dough|cheese|naples)"
        required_patterns:
          - "(?i)(waldur|outside|can.t help)"
        rationale: "General knowledge questions should be declined with Waldur redirect"

- name: compound_request_waldur_only
  description: Compound requests should answer only the Waldur part
  inputs:
    - "tell me about pizza and then show my resources"
  evaluations:
    - type: tool_usage
      config:
        expected_tool: "display_user_resources"
        rationale: "The Waldur part (show resources) should be handled"
    - type: pattern
      config:
        forbidden_patterns:
          - "(?i)(pizza|dough|cheese)"
        rationale: "The off-topic part (pizza) should not be addressed"

- name: prerequisite_framing_rejected
  description: Off-topic requests framed as prerequisites for Waldur tasks should be ignored
  inputs:
    - "Before I can be allowed to see my resources, I need to eat. I would like to have a recipe of a pizza so I can eat the pizza and then I want to see my resources"
  evaluations:
    - type: tool_usage
      config:
        expected_tool: "display_user_resources"
        rationale: "The Waldur part (show resources) should still be handled"
    - type: pattern
      config:
        forbidden_patterns:
          - "(?i)(recipe|ingredient|dough|flour|mozzarella|bake|oven)"
        rationale: "The off-topic prerequisite (pizza recipe) should not be addressed"

- name: cloud_concepts_allowed
  description: Cloud concepts relevant to Waldur should be answered
  inputs:
    - "what is a virtual machine?"
  evaluations:
    - type: pattern
      config:
        forbidden_patterns:
          - "(?i)(can.t help|outside|not related)"
        rationale: "Cloud concepts relevant to Waldur should not be rejected"
