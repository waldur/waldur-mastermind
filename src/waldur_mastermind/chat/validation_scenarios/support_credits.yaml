# Support-assistant validation scenarios — credits & policy actions.
#
# Loaded against the `credit_realistic` demo preset (generated by
# scripts/generate_realistic_credit_preset.py with --seed 42). Concrete
# values below correspond to the deterministic seed-42 output:
#   3 customers: Acme Research Lab, Bluewave Genomics, Crestford Climate Centre
#   30 projects, 19 with project credit, 11 without
#   3 overdrawn: Bluewave Glacier (severe ~3.46×), Gamma, Delta II (mild)
#   2 customer credits: Acme (100k), Bluewave (750k); Crestford has none.
#   4 unspent, 4 light, 1 warning, 0-2 critical, 2 mild + 1 severe overdrawn

- name: support_credit_balance_existing
  description: Support user asks for a credit-bearing project's balance.
  inputs:
    - "What's the current credit balance and consumption for Bluewave Vela?"
  evaluations:
    - type: tool_usage
      config:
        expected_tool: explain_project_credit_balance
        rationale: "Should call the credit-explainer tool, not get_project_quota or memory."
    - type: tool_arguments
      config:
        tool: explain_project_credit_balance
        args_must_contain:
          project_name: Vela
        rationale: "Must scope to Vela, not another project name."
    - type: data_match
      config:
        expected_values:
          - "Bluewave Vela"
        rationale: "Response must name the project under inspection."
    - type: pattern
      config:
        forbidden_patterns:
          - "(?i)Bluewave Glacier has [0-9]"
          - "(?i)Bluewave Gamma has [0-9]"
        rationale: "Must not leak data from sibling projects."

- name: support_overdrawn_projects_org
  description: Staff user asks which projects in Bluewave Genomics are overdrawn.
  inputs:
    - "Which projects in Bluewave Genomics have exceeded their project credit?"
  evaluations:
    - type: tool_usage
      config:
        expected_tool: list_overdrawn_projects
        rationale: "Dedicated tool answers this without ad-hoc per-project lookups."
    - type: data_match
      config:
        expected_values:
          - "Glacier"
          - "Gamma"
          - "Delta II"
        rationale: "All 3 overdrawn projects are in Bluewave Genomics."
    - type: pattern
      config:
        forbidden_patterns:
          - '(?i)(none|no projects?) (have|are) (overdrawn|exceeded)'
          - "(?i)Bluewave Vela.*(overdrawn|exceeded)"
          - "(?i)Bluewave Elysium.*(overdrawn|exceeded)"
        rationale: "Vela (78% utilised) and Elysium (unspent) are NOT overdrawn."

- name: support_no_credit_configured
  description: Asking about a project with no credit configured.
  inputs:
    - "What's the credit balance for Crestford Alpha?"
  evaluations:
    - type: tool_usage
      config:
        expected_tool: explain_project_credit_balance
        rationale: "Tool must be called even when the answer is 'no credit configured'."
    - type: data_match
      config:
        expected_values:
          - "Crestford Alpha"
        rationale: "Response must name the project."
    - type: pattern
      config:
        required_patterns:
          # match common phrasings used by the LLM for "no credit configured"
          - "(?i)(no\\s+(allocated|specific|project|customer)?\\s*credit|no\\s+credit\\s+(allocation|configured|set)|does\\s+not\\s+have\\s+(a |an |any )?(allocated\\s+|specific\\s+)?credit|credit\\s+(allocation|tracking)\\s+is\\s+not|not\\s+configured|hasn't\\s+been\\s+(set|allocated)|is\\s+`?null`?|not\\s+funded|shows\\s+`?null`?)"
        forbidden_patterns:
          - '(?i)Crestford Alpha has [0-9].*(remain|balance|left)'
        rationale: "Must communicate the 'no credit configured' state in any reasonable phrasing, not invent a number."

- name: support_credit_no_fabrication
  description: Asking about a non-existent project should not produce fabricated numbers.
  inputs:
    - "What is the credit balance for Project Nonexistent Phantom?"
  evaluations:
    - type: pattern
      config:
        required_patterns:
          - "(?i)(not found|no such|does not exist|cannot find|couldn't find|do not see|don't see|no project)"
        forbidden_patterns:
          - "(?i)Phantom has [0-9]"
          - '(?i)Phantom.{0,40}(balance|credit) (is|of) [0-9]'
        rationale: "Assistant must refuse instead of inventing a balance."

- name: support_overdrawn_global
  description: List ALL overdrawn projects (no org filter).
  inputs:
    - "List all projects that have run out of credit."
  evaluations:
    - type: tool_usage
      config:
        expected_tool: list_overdrawn_projects
        rationale: "Same tool, no customer_name argument."
    - type: data_match
      config:
        expected_values:
          - "Glacier"
        rationale: "Glacier is the most-overdrawn project (~3.46x); must always be cited."
    - type: pattern
      config:
        forbidden_patterns:
          - '(?i)(none|no projects?) (have|are) (overdrawn|exceeded)'
        rationale: "There ARE overdrawn projects; refusing is wrong."
