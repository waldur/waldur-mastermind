# Validation questions for `waldur ai_assistant docs_evaluation --questions`
# (waldur/waldur-docs#37). Written before any page they point at was changed,
# then used to choose between variants (section questions, kinds, the concept
# weight), so their scores flatter the chosen variant. To measure whether a
# change generalises, use evaluation_questions_test.yaml instead.
- id: h_org_invite
  category: howto
  question: How do I invite someone to my organization?
  queries: [invite user organization]
  gold: [user-guide/customer-organization/organization_membership_management.md]

- id: h_end_date
  category: howto
  question: How can I change when my resource expires?
  queries: [change resource end date, resource expiry]
  gold: [user-guide/customer-organization/resource-end-date-changes.md]

- id: h_end_date_passes
  category: concept
  question: What happens to my resource when its end date passes?
