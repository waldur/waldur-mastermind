Generate OpenAPI schema diff:
  stage: deploy
  interruptible: true
  image:
    name: registry.hpc.ut.ee/mirror/tufin/oasdiff:latest
    entrypoint: [""]
  needs:
    - Generate OpenAPI schema
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  before_script:
    - apk update
    - apk add --no-cache git nodejs npm
    - npm install -g markdownlint-cli
  script:
    - ls -la
    - echo "Cloning docs repository"
    - git clone "https://github.com/waldur/waldur-docs.git"
    - ls waldur-docs
    - |
      # First try to find the previous version if current tag exists
      if [ -f "waldur-docs/docs/API/waldur-openapi-schema-${CI_COMMIT_TAG}.yaml" ]; then
        echo "Current tag file exists, finding previous version"
        PREV_SCHEMA=$(ls waldur-docs/docs/API/waldur-openapi-schema-*.yaml | sort -V | grep -B1 "waldur-openapi-schema-${CI_COMMIT_TAG}.yaml" | head -n1)
      else
        echo "Current tag file does not exist, getting latest version"
        PREV_SCHEMA=$(ls waldur-docs/docs/API/waldur-openapi-schema-*.yaml | sort -V | tail -n1 || echo "")
      fi

    - echo "Previous schema $PREV_SCHEMA"
    - |
      if [ -z "$PREV_SCHEMA" ]; then
        echo "No previous schema found. Skipping diff generation."
        touch $CI_PROJECT_DIR/openapi-diff.md
        echo "No previous schema found. Skipping diff generation." > $CI_PROJECT_DIR/openapi-diff.md
      else
        echo "Previous schema found: $PREV_SCHEMA"
        /usr/bin/oasdiff diff -f markup $PREV_SCHEMA $CI_PROJECT_DIR/waldur-openapi-schema.yaml > $CI_PROJECT_DIR/openapi-diff.md
        ls -la $CI_PROJECT_DIR/openapi-diff.md
        head -n 30 $CI_PROJECT_DIR/openapi-diff.md || true
        sed -i "1i # OpenApi Schema Diff - ${CI_COMMIT_TAG}\n\n## For version ${CI_COMMIT_TAG}" $CI_PROJECT_DIR/openapi-diff.md
        markdownlint  --disable MD041 MD035 --fix $CI_PROJECT_DIR/openapi-diff.md || true
        head -n 30 $CI_PROJECT_DIR/openapi-diff.md || true
      fi
  artifacts:
    paths:
      - openapi-diff.md
    expire_in: 1 day

Upload OpenAPI schema and schema diff to docs:
  stage: postdeploy
  interruptible: true
  needs:
    - Generate OpenAPI schema
    - Generate OpenAPI schema diff
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  image:
    name: registry.hpc.ut.ee/mirror/alpine/git:latest
    entrypoint: [""]
  script:
    - cd /tmp/
    - git clone "https://gitlab-ci-token:$GITLAB_TOKEN@$CI_SERVER_HOST/waldur/waldur-docs.git"
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - cd waldur-docs
    # Upload OpenAPI schema
    - mkdir -p docs/API
    - cp $CI_PROJECT_DIR/waldur-openapi-schema.yaml docs/API/waldur-openapi-schema-${CI_COMMIT_TAG}.yaml
    - ls -la docs/API
    # Upload OpenAPI schema diff
    - mkdir -p docs/integrator-guide/APIs/api-changes
    - |
      if [ -s "$CI_PROJECT_DIR/openapi-diff.md" ]; then
        cp $CI_PROJECT_DIR/openapi-diff.md docs/integrator-guide/APIs/api-changes/waldur-openapi-schema-${CI_COMMIT_TAG}-diff.md
      else
        echo "No API changes detected, skipping diff file upload"
      fi
    - ls -la docs/integrator-guide/APIs/api-changes
    # Commit and push changes
    - git add docs/API docs/integrator-guide/APIs/api-changes
    - git commit -m "Add Waldur OpenAPI schema and diff for ${CI_COMMIT_TAG}" || exit 0
    - git branch new-api-schema-${CI_COMMIT_TAG}
    - git push --set-upstream origin new-api-schema-${CI_COMMIT_TAG}:master
  before_script: []

Upload TypeScript SDK:
  stage: postdeploy
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
  image:
    name: registry.hpc.ut.ee/mirror/alpine/git:latest
    entrypoint: [""]
  needs:
    - Generate TypeScript SDK
  script:
    - cd /tmp/
    - git clone --branch main git@github.com:waldur/js-client.git
    - cd js-client
    - git pull
    - rm -rf src/
    - mv $CI_PROJECT_DIR/waldur-typescript-sdk src
    - git add src
    - git commit -m "Update Waldur TypeScript SDK" || exit 0
    - git push
  before_script:
    - echo "[+] Adding ssh keys to the home directory"
    - mkdir -p ~/.ssh
    - cat $SSH_JENKINS_GITHUB_PRIVATE_KEY | tr -d '\r' > ~/.ssh/id_rsa
    - cat $SSH_JENKINS_GITHUB_PUBLIC_KEY | tr -d '\r' > ~/.ssh/id_rsa.pub
    - chmod 600 ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa.pub
    - ssh-keygen -lf ~/.ssh/id_rsa.pub
    - ssh-keyscan -H "github.com" >> ~/.ssh/known_hosts
    - git config --global user.email "ci@waldur.com"
    - git config --global user.name "Waldur Gitlab Runner"
