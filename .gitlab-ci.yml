Build docker image for tests:
  stage: build
  interruptible: true
  image: "quay.io/buildah/stable"
  rules:
    # Skip on SDK-only scheduled pipelines
    - if: '$SKIP_BUILD == "true" || $SKIP_BUILD == "yes"'
      when: never
    # If scheduled pipeline for 'develop' branch is set up
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
  variables:
    DOCKER_REGISTRY: registry.hpc.ut.ee/mirror/
  script:
    - echo $CI_COMMIT_SHA > docker/rootfs/COMMIT
    - cat docker/rootfs/COMMIT
    - echo "$WALDUR_DOCKER_HUB_PASSWORD" | buildah login docker.io --username "$WALDUR_DOCKER_HUB_USER" --password-stdin
    - buildah build
      --platform=linux/amd64
      --build-arg DOCKER_REGISTRY=$DOCKER_REGISTRY
      -f ${CI_PROJECT_DIR}/tests/Dockerfile
      -t "$WALDUR_MASTERMIND_TEST_IMAGE"
      ${CI_PROJECT_DIR}
    - buildah push "$WALDUR_MASTERMIND_TEST_IMAGE"

# Builds the image the downstream E2E suite actually runs on for merge requests.
#
# Before this job existed, "Trigger integration tests" passed
# ${CI_REGISTRY_IMAGE}:latest on every pipeline — but the two jobs that write
# that tag ("Publish the YOLO multiarch docker image" and "Publish the latest
# multiarch docker image") both inherit `$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH`
# from waldur-pipelines /templates/release/publish-multiarch.yml. Nothing in an
# MR pipeline built an MR image, so every MR ran the full 13-job E2E suite
# against whatever develop last published: ~800s of blocking wall-clock and
# ~67 runner-minutes spent on a result that could not describe the MR. See #293.
#
# Mirrors waldur-homeport's "Build test docker image", which has always pinned
# its downstream to ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-e2e.
Build MR image for integration tests:
  stage: test
  interruptible: true
  image: "quay.io/buildah/stable"
  rules:
    # Skip tests if said so
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    # Same change filter as the trigger that consumes this image — building it
    # for a docs-only MR would be pure cost, since the trigger would not fire.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &integration_test_changes
        - src/**/*
        - docker/**/*
        - Dockerfile
        - pyproject.toml
        - uv.lock
  variables:
    DOCKER_REGISTRY: registry.hpc.ut.ee/mirror/
  cache: []
  before_script:
    - echo "[+] Build image for merge request ${CI_MERGE_REQUEST_ID}"
    # Baked into the image at / by `COPY docker/rootfs /`, same as the YOLO job.
    - echo $CI_COMMIT_SHA > docker/rootfs/COMMIT_SHA
    - echo "${CI_REGISTRY_PASSWORD}" | buildah login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  script:
    - buildah bud
      --platform=linux/amd64
      --build-arg DOCKER_REGISTRY="${DOCKER_REGISTRY}"
      -t "${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-e2e"
      -f "${CI_PROJECT_DIR}/Dockerfile"
      "${CI_PROJECT_DIR}"
    - buildah push "${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-e2e"

Publish the latest multiarch docker image:
  extends: .Publish multiarch latest docker image template
  # The template's dind service comes from public.ecr.aws, which rate-limits
  # anonymous pulls ("toomanyrequests: Rate exceeded"). Use the UT mirror.
  services:
    - name: registry.hpc.ut.ee/mirror/library/docker:27-dind
      command: ["--mtu=1400"]
      alias: docker
  script:
    - docker context create builder
    - docker buildx create builder --use
    - docker buildx imagetools create --tag opennode/${CI_PROJECT_NAME}:latest opennode/${CI_PROJECT_NAME}:yolo
    # The yolo tag is an OCI index holding the linux/amd64 image plus a buildx
    # attestation manifest (platform unknown/unknown). Copying the whole index
    # into the GitLab registry fails on the attestation with "blob unknown to
    # registry", so copy just the platform image — which is all the integration
    # tests and docker-compose consume. Attestations stay on Docker Hub.
    - apk add --no-cache skopeo
    - skopeo copy --override-os linux --override-arch amd64
      docker://opennode/${CI_PROJECT_NAME}:yolo
      docker://${CI_REGISTRY_IMAGE}:latest

Publish the YOLO multiarch docker image:
  extends: .Publish multiarch latest docker image template
  stage: test
  # See the comment above: avoid the rate-limited public.ecr.aws dind image.
  services:
    - name: registry.hpc.ut.ee/mirror/library/docker:27-dind
      command: ["--mtu=1400"]
      alias: docker
  variables:
    IMAGE_TAG: "opennode/${CI_PROJECT_NAME}:yolo"
  before_script:
    # Merge the before_script from the template
    - !reference [
        .Publish multiarch latest docker image template,
        before_script,
      ]
    - echo '[+] Build and publish yolo docker image'
    - echo $CI_COMMIT_SHA > docker/rootfs/COMMIT_SHA

Publish multiarch docker image with specific version:
  extends: .Publish multiarch docker image with specific version template
  services:
    - name: registry.hpc.ut.ee/mirror/library/docker:27-dind
      command: ["--mtu=1400"]
      alias: docker
  before_script:
    # Merge the before_script from the template
    - !reference [
        .Publish multiarch docker image with specific version template,
        before_script,
      ]
    - echo "[+] Build and publish $CI_COMMIT_TAG docker image"
    - echo $CI_COMMIT_TAG > docker/rootfs/COMMIT_TAG
    - sed -i "s/version = \"0.0.0\"/version = \"$CI_COMMIT_TAG\"/" pyproject.toml

Test Multi-arch docker image build:
  stage: test
  interruptible: true
  allow_failure: true
  image: "quay.io/buildah/stable"
  rules:
    # Skip tests if said so
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    # `.gitlab-ci.yml` is deliberately not in the filter — same reasoning as
    # "Trigger integration tests" above. This job takes ~410s (measured on
    # pipeline 128116) and is `allow_failure: true`, so on a CI-config-only
    # merge request it spent that time without being able to block anything.
    # What it actually exercises is the Dockerfile and its build context.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Dockerfile
        - docker/**/*
  variables:
    DOCKER_REGISTRY: registry.hpc.ut.ee/mirror/
  cache: []
  before_script:
    - dnf update -y
    - dnf install -y gcc python3-devel musl-devel kernel-headers openldap-devel openssl libffi-devel libjpeg-turbo-devel libxml2-devel libxslt-devel
    - echo "$CI_REGISTRY_PASSWORD" | buildah login $CI_REGISTRY --username "$CI_REGISTRY_USER" --password-stdin
  script:
    # Build x86-based image
    - buildah build
      --platform=linux/amd64
      --build-arg DOCKER_REGISTRY=$DOCKER_REGISTRY
      -t ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-multiarch-amd64
      ${CI_PROJECT_DIR}
    - buildah push ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-multiarch-amd64
    - buildah inspect ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-multiarch-amd64
    # Build ARM-based image
    - buildah build
      --platform=linux/arm64
      --build-arg DOCKER_REGISTRY=$DOCKER_REGISTRY
      -t ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-multiarch-arm64
      ${CI_PROJECT_DIR}
    - buildah push ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-multiarch-arm64
    - buildah inspect ${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-multiarch-arm64

