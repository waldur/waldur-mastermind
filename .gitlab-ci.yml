Generate OpenAPI schema diff:
  stage: deploy
  interruptible: true
  image:
    name: registry.hpc.ut.ee/mirror/tufin/oasdiff:latest
    entrypoint: [""]
  needs:
    - Generate OpenAPI schema
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  before_script:
    - apk update
    - apk add --no-cache git nodejs npm
    - npm install -g markdownlint-cli
  script:
    - ls -la
    - echo "Cloning api-docs repository"
    - git clone --depth 1 "https://github.com/waldur/api-docs.git"
    - ls api-docs
    - |
      # Find previous schema from api-docs repository
      if [ -f "api-docs/docs/API/waldur-openapi-schema-${CI_COMMIT_TAG}.yaml" ]; then
        echo "Current tag file exists, finding previous version"
        PREV_SCHEMA=$(ls api-docs/docs/API/waldur-openapi-schema-*.yaml | sort -V | grep -B1 "waldur-openapi-schema-${CI_COMMIT_TAG}.yaml" | head -n1)
      else
        echo "Current tag file does not exist, getting latest version"
        PREV_SCHEMA=$(ls api-docs/docs/API/waldur-openapi-schema-*.yaml | sort -V | tail -n1 || echo "")
      fi

    - echo "Previous schema $PREV_SCHEMA"
    - |
      if [ -z "$PREV_SCHEMA" ]; then
        echo "No previous schema found. Skipping diff generation."
        touch $CI_PROJECT_DIR/openapi-diff.md
        echo "No previous schema found. Skipping diff generation." > $CI_PROJECT_DIR/openapi-diff.md
      else
        echo "Previous schema found: $PREV_SCHEMA"
        /usr/bin/oasdiff diff -f markup $PREV_SCHEMA $CI_PROJECT_DIR/waldur-openapi-schema.yaml > $CI_PROJECT_DIR/openapi-diff.md
        ls -la $CI_PROJECT_DIR/openapi-diff.md
        head -n 30 $CI_PROJECT_DIR/openapi-diff.md || true
        sed -i "1i # OpenAPI schema diff - ${CI_COMMIT_TAG}\n\n## For version ${CI_COMMIT_TAG}" $CI_PROJECT_DIR/openapi-diff.md
        markdownlint  --disable MD041 MD035 --fix $CI_PROJECT_DIR/openapi-diff.md || true
        head -n 30 $CI_PROJECT_DIR/openapi-diff.md || true
      fi
  artifacts:
    paths:
      - openapi-diff.md
    expire_in: 1 day

