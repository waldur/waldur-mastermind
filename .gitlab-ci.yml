before_script:
  - export

.build_before_script: &build_before_script
  - echo "[+] Adding SSH keys to the home directory"
  - mkdir -p ~/.ssh
  - cat "$SSH_JENKINS_GITHUB_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
  - cat "$SSH_JENKINS_GITHUB_PUBLIC_KEY" | tr -d '\r' > ~/.ssh/id_rsa.pub
  - chmod 600 ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa.pub
  - ssh-keygen -lf ~/.ssh/id_rsa.pub
  - ssh-keyscan -H "github.com" >> ~/.ssh/known_hosts
  - git config --global user.name "$GITLAB_USER_NAME"
  - git config --global user.email "$GITLAB_USER_EMAIL"

# Define a common set of rules using a YAML anchor ---
# This anchor ensures that any job using it will have the exact same
# conditions for being included in a pipeline. This is the key to solving
# the 'needs' validation error from before, in a clean, maintainable way.
.unit_test_rules: &unit_test_rules
  rules:
    # Skip tests if said so
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    # If tagged release
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    # If event is related to a created merge request with relevant code changes
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - pyproject.toml
        - uv.lock
        - tests/**/* # Include the tests directory in changes
        - .gitlab-ci.yml # A change to the CI file itself should trigger tests

Run linters:
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
