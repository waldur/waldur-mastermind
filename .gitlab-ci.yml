Upload HomePort enums:
  stage: postdeploy
  interruptible: true
  rules:
    # SDK release jobs require explicit opt-in via BUILD_SDK on the schedule
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_SDK != "true" && $BUILD_SDK != "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
  image: registry.hpc.ut.ee/mirror/$WALDUR_MASTERMIND_TEST_IMAGE
  variables:
    DJANGO_SETTINGS_MODULE: waldur_core.server.doc_settings
  script:
    # 1. Install dependencies in the main project
    - pip install uv
    - uv sync --group dev

    # 2. Generate ALL required files from the main project context and store them in /tmp
    # This is the most robust approach, as we are in the correct directory with the virtual env.
    - echo "Generating enums and descriptions..."
    - python src/waldur_core/permissions/print_permission_enums.py > /tmp/permission_enums.ts
    - uv run waldur print_events_enums > /tmp/EventsEnums.ts
    - uv run waldur print_features_enums > /tmp/FeaturesEnums.ts
    - uv run waldur print_features_description > /tmp/FeaturesDescription.ts
    - uv run waldur print_settings_description > /tmp/SettingsDescription.ts
    - uv run waldur print_permissions_description > /tmp/PermissionOptions.tsx

    # 3. Clone the HomePort repository and move the generated files into it
    - cd /tmp/
    - git clone --depth 1 --branch develop "https://gitlab-ci-token:$GITLAB_TOKEN@$CI_SERVER_HOST/waldur/waldur-homeport.git"
    - cd waldur-homeport
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"

    # 4. Move the pre-generated files to their final destinations
    - mv /tmp/permission_enums.ts src/permissions/enums.ts
    - mv /tmp/EventsEnums.ts src/EventsEnums.ts
    - mv /tmp/FeaturesEnums.ts src/FeaturesEnums.ts
    - mv /tmp/FeaturesDescription.ts src/features/FeaturesDescription.ts
    - mv /tmp/SettingsDescription.ts src/SettingsDescription.ts
    - mv /tmp/PermissionOptions.tsx src/administration/roles/PermissionOptions.tsx

    # 5. Commit and push the changes
    - git add src/
    - git commit -m "Update enums and descriptions from Waldur Mastermind" || exit 0
    - git branch new-enums
    - git push --set-upstream origin new-enums:develop
  before_script: []

Trigger integration tests:
  stage: validate
  trigger:
    project: waldur/waldur-integration-testing
    branch: main
    strategy: depend
  # Without `needs:` this bridge is only stage-ordered, so it could not start
  # until every job in `test`, `build` and `release` had finished — including the
  # ~23-minute 15-shard unit suite — although all it depends on is one image.
  # Naming the image producers lets the E2E suite overlap the unit tests instead
  # of queueing behind them. Both are `optional` because only one exists in any
  # given pipeline: the MR build on merge requests, the release job on develop.
  # See #293.
  needs:
    - job: Build MR image for integration tests
      optional: true
    - job: Publish the latest multiarch docker image
      optional: true
  variables:
    # TRIGGER_SOURCE is forwarded to the downstream E2E suite so it can identify
    # which upstream repo triggered it (backend-only jobs stay on for mastermind).
    TRIGGER_SOURCE: mastermind
  rules:
    # Skip tests if said so
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    # Only run E2E when a change can affect backend behaviour or the stack image.
    # Docs-only / lint-config-only changes (CHANGELOG, *.md, docs/**) skip it.
    #
    # `.gitlab-ci.yml` is deliberately NOT in the filter. It used to be, which
    # meant any CI-config-only merge request paid a full image build plus the
    # 13-job downstream suite (~67 runner-minutes) even when the change could
    # not possibly affect E2E behaviour — MR !6128, which only edits a
    # migration-test rule, is exactly that case. GitLab's `changes:` cannot tell
    # which part of the file moved, so it is all-or-nothing.
    #
    # If you are changing the E2E wiring here and want the suite to exercise it
    # (as !6126 did), include any change under `src/**` in the same merge
    # request — a real backend change already does. A `RUN_E2E=true` variable
    # was tried instead and does not work: `glab ci run` and the pipeline API
    # create branch pipelines, not `merge_request_event` ones, so a rule keyed
    # on both never matches and the pipeline comes back empty.
    #
    # WALDUR_MASTERMIND_IMAGE is set per-rule, not in `variables:` above: on
    # develop the release job has just republished :latest, but on a merge
    # request :latest is still develop's image and testing it says nothing about
    # the MR — so MRs get the image built from their own code. Each rule sets it
    # explicitly rather than relying on a job-level default, because getting
    # this wrong is silent: the suite goes green against someone else's code.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *integration_test_changes
      variables:
        WALDUR_MASTERMIND_IMAGE: "${CI_REGISTRY_IMAGE}:latest"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *integration_test_changes
      variables:
        WALDUR_MASTERMIND_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_MERGE_REQUEST_ID}-e2e"

Release tag:
  extends: .release-tag-base

# Fails when a dependency arrives under a licence Waldur cannot ship — strong
# copyleft (GPL, AGPL), source-available (SSPL, BUSL, Elastic) or non-OSI
# use-restricted (Hippocratic, JSON). LGPL and MPL pass but stay listed in the
# artifact. See #285.
#
# The two exemptions are defective upstream metadata, not incompatible licences:
# matrix-nio ships its whole licence text in the `License:` field (it is ISC),
# and django-jsoneditor publishes an empty one.
#
# allow_failure is inherited as true from the template. Drop it to false once
# #286 (html2text is GPL-3.0-or-later) is closed.
Check dependency licences:
  extends: .Licence gate (python) template
  variables:
    LICENCE_EXEMPT_PACKAGES: "matrix-nio django-jsoneditor"
    # Beyond the template's default git: python-ldap (via django-auth-ldap)
    # publishes no wheel on any platform, so the sync builds it from its sdist
    # and needs a compiler plus the OpenLDAP and Cyrus SASL headers.
    LICENCE_SYSTEM_PACKAGES: "git build-essential libldap2-dev libsasl2-dev"
