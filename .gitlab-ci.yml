.Unit test runner:
  image: registry.hpc.ut.ee/mirror/$WALDUR_MASTERMIND_TEST_IMAGE
  stage: test
  interruptible: true
  <<: *unit_test_rules
  before_script:
    - |
      echo "[+] Installing project dependencies..."
      pip install uv
      uv sync --group dev

  variables:
    UV_CACHE_DIR: .uv-cache
    UV_SYSTEM_PYTHON: 1
    UV_LINK_MODE: copy

  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR

Generate OpenAPI schema:
  extends: .Unit test runner
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RELEASE_VERSION'
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - export VERSION="${RELEASE_VERSION:-$CI_COMMIT_TAG}"
    - |
      if [ -z "$VERSION" ] || [ "$VERSION" = "develop" ]; then
        git fetch --tags || true
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        case "$LATEST_TAG" in
          *-*) VERSION="${LATEST_TAG}.dev.${TIMESTAMP}" ;;
          *)   VERSION="${LATEST_TAG}-dev.${TIMESTAMP}" ;;
        esac
      fi
    - echo "Generating OpenAPI schema version ${VERSION} ..."
    - uv run waldur spectacular --api-version "$VERSION" --file "$CI_PROJECT_DIR/waldur-openapi-schema.yaml" --fail-on-warn
    - SKIP_MAKE_FIELDS_OPTIONAL=true uv run waldur spectacular --api-version "$VERSION" --file "$CI_PROJECT_DIR/waldur-typescript-schema.yaml" --fail-on-warn
  variables:
    DJANGO_SETTINGS_MODULE: waldur_core.server.doc_settings
  artifacts:
    paths:
      - waldur-openapi-schema.yaml
      - waldur-typescript-schema.yaml
    expire_in: 1 week

Check database migrations:
  extends: .Unit test runner
  stage: test
  script:
    - uv run waldur makemigrations --check --dry-run
  variables:
    DJANGO_SETTINGS_MODULE: waldur_core.server.base_settings

# Profiles the import/startup memory footprint of `waldur check` under memray and
# fails if peak memory exceeds MEMORY_BUDGET_MB. Manual and non-blocking for now
# (allow_failure) so it surfaces the number and a flamegraph artifact without
# gating merges; promote to automatic/blocking once the baseline is stable.
Check startup memory budget:
  extends: .Unit test runner
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
  script:
    - uv run python scripts/measure_startup_memory.py --label ci
  variables:
    DJANGO_SETTINGS_MODULE: waldur_core.server.base_settings
    MEMORY_BUDGET_MB: "550"
  artifacts:
    when: always
    paths:
      - scripts/memory_profiles/flamegraph-ci.html
      - scripts/memory_profiles/startup_summary.csv
      - scripts/memory_profiles/startup_components.csv
    expire_in: 1 week

Run migration tests:
  extends: .Unit test runner
  rules:
    # Skip tests if said so
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    # Always run on develop branch to ensure it's clean
    - if: '$CI_COMMIT_BRANCH == "develop"'
    # Always run on tagged releases
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    # For merge requests, only run if migration files have changed
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/migrations/*.py
  script:
    - |
      echo "[+] Setting up test database configuration..."
      cat > src/waldur_mastermind/test_settings.py <<-EOF
      from waldur_core.server.test_settings import *
      from django.db.backends.base.schema import BaseDatabaseSchemaEditor

      # Using UNLOGGED tables in PostgreSQL is a significant performance boost for
      # tests, as it reduces disk I/O by not writing to the WAL.
      BaseDatabaseSchemaEditor.sql_create_table = "CREATE UNLOGGED TABLE %(table)s (%(definition)s)"

      DATABASES = {
          'default': {
              'ENGINE': 'django.db.backends.postgresql',
              'NAME': 'test_waldur',
              'USER': 'runner',
              'HOST': 'postgres',
              'PORT': 5432,
              'PASSWORD': 'waldur',
          }
      }
      EOF
      uv run waldur migrate --noinput
  services:
    - name: "registry.hpc.ut.ee/mirror/library/postgres:15-alpine"
      alias: postgres
      command:
        [
          "postgres",
          "-cfsync=off",
          "-cfull_page_writes=off",
          "-cmax_connections=1000",
          "-cshared_buffers=1GB",
          "-ceffective_cache_size=4GB",
          "-cwork_mem=32MB",
          "-cmaintenance_work_mem=32MB",
          "-ctemp_buffers=16MB",
          "-cwal_buffers=48MB",
        ]
  variables:
    POSTGRES_DB: test_waldur
    POSTGRES_USER: runner
    POSTGRES_PASSWORD: waldur
    DJANGO_SETTINGS_MODULE: waldur_mastermind.test_settings

Run demo presets tests:
  extends: .Unit test runner
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/waldur_mastermind/marketplace/demo_presets/**/*
        - src/waldur_mastermind/marketplace/management/commands/import_structure.py
        - src/waldur_mastermind/marketplace/management/commands/cleanup_structure.py
        # Also validate edits to this job's own CI config (cheap now that the
        # migration replay is skipped — see --no-migrations below).
        - .gitlab-ci.yml
  script:
    - |
      echo "[+] Setting up test database configuration..."
      cat > src/waldur_mastermind/test_settings.py <<-EOF
      from waldur_core.server.test_settings import *
      from django.db.backends.base.schema import BaseDatabaseSchemaEditor

      # Using UNLOGGED tables in PostgreSQL is a significant performance boost for
      # tests, as it reduces disk I/O by not writing to the WAL.
      BaseDatabaseSchemaEditor.sql_create_table = "CREATE UNLOGGED TABLE %(table)s (%(definition)s)"

      DATABASES = {
          'default': {
              'ENGINE': 'django.db.backends.postgresql',
              'NAME': 'test_waldur',
              'USER': 'runner',
              'HOST': 'postgres',
              'PORT': 5432,
              'PASSWORD': 'waldur',
          }
      }
      EOF
    # --no-migrations builds the schema directly from models (as the sharded unit
    # suite does) instead of replaying the full migration history. Profiling showed
    # ~1278s of this job's ~1408s was that one-time migration replay — the actual
    # preset loads take ~90s. The test only exercises the ORM against the current
    # schema, so skipping migrations is safe and mirrors the rest of the test infra.
    - uv run pytest --no-migrations src/waldur_mastermind/marketplace/tests/test_demo_presets.py::DemoPresetLoadTest -v
  services:
    - name: "registry.hpc.ut.ee/mirror/library/postgres:15-alpine"
      alias: postgres
      command:
        [
          "postgres",
          "-cfsync=off",
          "-cfull_page_writes=off",
          "-cmax_connections=1000",
          "-cshared_buffers=1GB",
          "-ceffective_cache_size=4GB",
          "-cwork_mem=32MB",
          "-cmaintenance_work_mem=32MB",
          "-ctemp_buffers=16MB",
          "-cwal_buffers=48MB",
        ]
  variables:
    POSTGRES_DB: test_waldur
    POSTGRES_USER: runner
    POSTGRES_PASSWORD: waldur
    DJANGO_SETTINGS_MODULE: waldur_mastermind.test_settings

# This is the "preparation" job. It's not parallelized.
# Its only responsibilities are to check for merge conflicts and generate the dynamic
# child pipeline configuration based on the code changes.
Generate test pipeline:
  stage: test
  extends: .Unit test runner
  script:
    - |
      # STEP 1: Perform the merge check to fail fast.
      if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then
        echo "[+] Checking merge compatibility..."
        echo "[+] Add dummy user $GIT_USER_NAME ($GIT_USER_EMAIL)"
        git config user.name $GIT_USER_NAME
        git config user.email $GIT_USER_EMAIL
        git merge --no-ff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" || exit 1
        echo "[+] Merge successful."
      fi

      # STEP 2: Run the generator script.
      # This script will create two files:
      # 1. generated-pipeline.yml (the definition of the child pipeline)
      # 2. generated_vars.env (a dotenv file with the TEST_PATHS variable)
      echo "[+] Generating dynamic test pipeline configuration..."
      tests/generate-pipeline.sh
  artifacts:
    # We need to save both generated files as artifacts.
    # Consumed by the 'Run tests dynamically' trigger job in the same pipeline,
    # so they have no value once that pipeline finishes.
    expire_in: 1 day
    paths:
      - generated-pipeline.yml
    reports:
      # This makes the variables in generated_vars.env available to this job
      # and any downstream jobs that depend on it (like our trigger job).
      dotenv: generated_vars.env

# This is the "trigger" job. It has no script.
# Its only purpose is to start the child pipeline defined in the artifact
# from the previous job.
Run tests dynamically:
  stage: test
  # Use the same rules anchor to ensure it's always included/excluded
  # with the 'generate_test_pipeline' job.
  <<: *unit_test_rules
  # This job must run after the 'Generate test pipeline' job has successfully completed.
  needs:
    - job: Generate test pipeline
      # 'artifacts: true' is crucial. It tells this job to download the artifacts
      # from the 'Generate test pipeline' job before it runs.
      artifacts: true
  trigger:
    # This tells GitLab to start a new pipeline.
    include:
      # Specify which artifact to use as the CI configuration for the new pipeline.
      - artifact: generated-pipeline.yml
        job: Generate test pipeline
    # 'strategy: depend' makes this trigger job wait for the child pipeline to finish.
    strategy: depend
    # This block explicitly tells GitLab to pass variables to the child pipeline.
    forward:
      # This is the crucial line. It forwards variables created by 'dotenv'
      # reports from the 'needs' dependencies, as well as variables defined
      # in the parent job's 'variables' block.
      yaml_variables: true
      # It's also good practice to forward the standard CI variables like
      # CI_COMMIT_REF_NAME, CI_MERGE_REQUEST_ID, etc.
      pipeline_variables: true

Run type checkings:
  extends: .Unit test runner
  script:
