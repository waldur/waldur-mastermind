Generate Ansible modules:
  stage: deploy
  interruptible: true
  rules:
    # Run for both tagged releases and scheduled dev releases
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  image: registry.hpc.ut.ee/mirror/library/python:3.11-bullseye
  needs:
    - Generate OpenAPI schema
  before_script:
    - apt-get update && apt-get install -y jq
    # Ensure the CI runner has all tags from the remote repository
    - git fetch --tags
  script: |
    # Install necessary tools
    pip install yq git+https://github.com/waldur/ansible-waldur-generator.git
    # Determine the release version based on the trigger
    if [ -n "$CI_COMMIT_TAG" ]; then
      # This is a stable, tagged release. The version is the tag itself.
      RELEASE_VERSION="$CI_COMMIT_TAG"
      echo "Building stable release version: $RELEASE_VERSION"
    else
      # This is a dev release from a schedule.
      # Find the latest tag to use as a base for the pre-release version.
      LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
      TIMESTAMP=$(date +%Y%m%d%H%M%S)
      RELEASE_VERSION="${LATEST_TAG}-dev.${TIMESTAMP}"
      echo "Latest stable tag found: $LATEST_TAG"
      echo "Building development release version: $RELEASE_VERSION"
    fi

    # Update the version for EVERY collection in the generator config file
    echo "Updating ansible-generator-config.yaml to version $RELEASE_VERSION"
    yq -iy '.collections[].version = "'$RELEASE_VERSION'"' ansible-generator-config.yaml

    echo "--- Updated ansible-generator-config.yaml ---"
    cat ansible-generator-config.yaml
    echo "-------------------------------------------"

    # Generate the Ansible modules using the updated config
    ansible-waldur-generator --config ansible-generator-config.yaml --api-spec waldur-openapi-schema.yaml --output-dir ansible_waldur_module
  artifacts:
    paths:
      - ansible_waldur_module/
    expire_in: 1 day

Upload Ansible module:
  stage: postdeploy
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
  rules:
    # Run for both tagged releases and scheduled dev releases
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  image:
    name: registry.hpc.ut.ee/mirror/alpine/git:latest
    entrypoint: [""]
  needs:
    - Generate Ansible modules
  script: |
    cd /tmp/
    git clone --branch main git@github.com:waldur/ansible-waldur-module-next.git
    cd ansible-waldur-module-next
    git pull
    rm -rf ansible_waldur_module && cp -a "$CI_PROJECT_DIR/ansible_waldur_module/" ansible_waldur_module
    git add ansible_waldur_module
    if [ -n "$CI_COMMIT_TAG" ]; then
      # Stable release: commit, push code, create and push tag
      echo "Committing and tagging stable release $CI_COMMIT_TAG"
      git commit -m "Release: update modules for version $CI_COMMIT_TAG"
      git push origin main
      git tag -a $CI_COMMIT_TAG -m "Release $CI_COMMIT_TAG"
      git push origin $CI_COMMIT_TAG
    else
      # Dev release: just commit and push code, no tag
      echo "Committing development update"
      git commit -m "Update Ansible Waldur modules from develop branch"
      git push origin main
    fi
  before_script: *build_before_script

Publish Ansible Galaxy collection:
  stage: postdeploy
  interruptible: true
  rules:
    # Run for both tagged releases and scheduled dev releases
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  image:
    name: registry.hpc.ut.ee/mirror/library/python:3.11-bullseye
  needs:
    - Generate Ansible modules
  before_script:
    - apt-get update && apt-get install -y jq
    - pip install yq ansible
  script:
    - echo "--- Discovering and Publishing Ansible Collections ---"

    # The root directory where collections are located, from the artifacts.
    - COLLECTIONS_ROOT="ansible_waldur_module/ansible_collections"

    # Verify that the root directory exists.
    - |
      if [ ! -d "$COLLECTIONS_ROOT" ]; then
        echo "ERROR: Collections root '$COLLECTIONS_ROOT' not found in artifacts."
        exit 1
      fi

    # 1. Discover all collections by finding all 'galaxy.yml' files.
    - |
      find "$COLLECTIONS_ROOT" -name "galaxy.yml" | while read GALAXY_FILE; do
        # For each galaxy.yml found, get its parent directory, which is the collection path.
        COLLECTION_PATH=$(dirname "${GALAXY_FILE}")

        echo "=========================================================="
        echo "Processing Collection at: ${COLLECTION_PATH}"
        echo "=========================================================="

        # 2. Dynamically determine the collection details from its galaxy.yml
        NAMESPACE=$(yq '.namespace' "${GALAXY_FILE}" | tr -d '"')
        NAME=$(yq '.name' "${GALAXY_FILE}" | tr -d '"')
        VERSION=$(yq '.version' "${GALAXY_FILE}" | tr -d '"')

        echo "Found Collection: ${NAMESPACE}.${NAME} version ${VERSION}"

        # Validate that the details were parsed correctly.
        if [ -z "$NAMESPACE" ] || [ -z "$NAME" ] || [ -z "$VERSION" ]; then
          echo "ERROR: Could not parse details from ${GALAXY_FILE}. Skipping."
          continue # Skip to the next collection in the loop
        fi

        # 3. Build the collection by changing into its directory.
        echo "--- Building collection: ${NAMESPACE}.${NAME} ---"
        ( # Start a subshell to isolate the 'cd' command
          cd "${COLLECTION_PATH}"
          ansible-galaxy collection build --force
        ) # The subshell exits, and we are back in the original directory.

        # 4. Publish the dynamically named archive file.
        #    The built archive will be located in the collection directory itself (not parent).
        ARCHIVE_FILE_NAME="${NAMESPACE}-${NAME}-${VERSION}.tar.gz"
        ARCHIVE_FILE_PATH="${COLLECTION_PATH}/${ARCHIVE_FILE_NAME}"

        echo "--- Publishing archive: ${ARCHIVE_FILE_PATH} ---"

        # Verify the archive file exists before trying to publish.
        if [ ! -f "${ARCHIVE_FILE_PATH}" ]; then
          echo "ERROR: Expected archive file not found at ${ARCHIVE_FILE_PATH}. Checking parent directory..."
          # Try parent directory as fallback
          ARCHIVE_FILE_PATH_PARENT="$(dirname "${COLLECTION_PATH}")/${ARCHIVE_FILE_NAME}"
          if [ -f "${ARCHIVE_FILE_PATH_PARENT}" ]; then
            ARCHIVE_FILE_PATH="${ARCHIVE_FILE_PATH_PARENT}"
            echo "Found archive at: ${ARCHIVE_FILE_PATH}"
          else
            echo "ERROR: Archive file not found in collection or parent directory. Skipping."
            echo "Looking for: ${ARCHIVE_FILE_NAME}"
            echo "In collection dir:"
            ls -la "${COLLECTION_PATH}/" || true
            echo "In parent dir:"
            ls -la "$(dirname "${COLLECTION_PATH}")/" || true
            continue # Skip to the next collection
          fi
        fi

        ansible-galaxy collection publish --api-key "$ANSIBLE_GALAXY_TOKEN" "${ARCHIVE_FILE_PATH}"

        echo "Successfully published ${ARCHIVE_FILE_NAME} to Ansible Galaxy."
        echo "" # Add a blank line for readability
      done

    - echo "--- All collections processed ---"
