Generate OpenAPI schema:
  stage: deploy
  interruptible: true
  rules:
    # SDK release jobs require explicit opt-in via BUILD_SDK on the schedule
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_SDK != "true" && $BUILD_SDK != "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  # Use a stock Python image — uv sync installs all required deps.
  # Decoupled from "Build docker image for tests" so SDK release pipelines
  # don't block on test image build/push.
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
  needs: []
  variables:
    DJANGO_SETTINGS_MODULE: waldur_core.server.doc_settings
    UV_CACHE_DIR: .uv-cache
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  before_script:
    # System deps needed by some Python packages — mirrors tests/Dockerfile so
    # uv sync can build python-ldap / load python-magic / parse xmlsec etc.
    - apt-get update && apt-get install -y --no-install-recommends
      libldap2-dev libsasl2-dev ldap-utils xmlsec1 libmagic1 python3-dev
      && rm -rf /var/lib/apt/lists/*
    # Ensure the CI runner has all tags from the remote repository
    - git fetch --tags
  script:
    - pip install uv
    - uv sync --group dev

    # Determine the release version based on the trigger
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # This is a stable, tagged release. The version is the tag itself.
        RELEASE_VERSION="$CI_COMMIT_TAG"
        echo "Building OpenAPI schema for stable release version: $RELEASE_VERSION"
      else
        # This is a dev release from a schedule.
        # Find the latest tag to use as a base for the pre-release version.
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        # When LATEST_TAG already carries a pre-release suffix (e.g. 8.0.9-rc.12),
        # extend it with a dot so the dev counter is a fresh semver identifier
        # rather than fusing into an alphanumeric one. Otherwise comparison
        # between rc.9-dev and rc.12-dev falls back to lexical ASCII sort
        # (semver 2.0.0 §11.4.2), which inverts the intended order.
        case "$LATEST_TAG" in
          *-*) RELEASE_VERSION="${LATEST_TAG}.dev.${TIMESTAMP}" ;;
          *)   RELEASE_VERSION="${LATEST_TAG}-dev.${TIMESTAMP}" ;;
        esac
        echo "Latest stable tag found: $LATEST_TAG"
        echo "Building OpenAPI schema for development release version: $RELEASE_VERSION"
      fi

    # Generate the schema, injecting the dynamic version
    - uv run waldur spectacular --api-version "$RELEASE_VERSION" --file waldur-openapi-schema.yaml --fail-on-warn
    - SKIP_MAKE_FIELDS_OPTIONAL=true uv run waldur spectacular --api-version "$RELEASE_VERSION" --file waldur-typescript-schema.yaml --fail-on-warn
    - echo "Successfully generated OpenAPI schema with version $RELEASE_VERSION"
  artifacts:
    paths:
      - waldur-openapi-schema.yaml
      - waldur-typescript-schema.yaml
    expire_in: 1 day

