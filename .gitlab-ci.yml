.Unit test runner:
  image: registry.hpc.ut.ee/mirror/$WALDUR_MASTERMIND_TEST_IMAGE
  stage: test
  interruptible: true
  <<: *unit_test_rules
  before_script:
    - |
      echo "[+] Installing project dependencies..."
      pip install uv
      uv sync --group dev

  variables:
    UV_CACHE_DIR: .uv-cache
    UV_SYSTEM_PYTHON: 1
    UV_LINK_MODE: copy

  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR

Run openapi export test:
  extends: .Unit test runner
  script:
    - uv run waldur spectacular --file waldur-openapi-schema.yaml --fail-on-warn
    - uv run waldur makemigrations --check --dry-run
  variables:
    DJANGO_SETTINGS_MODULE: waldur_core.server.base_settings

# Profiles the import/startup memory footprint of `waldur check` under memray and
# fails if peak memory exceeds MEMORY_BUDGET_MB. Manual and non-blocking for now
# (allow_failure) so it surfaces the number and a flamegraph artifact without
# gating merges; promote to automatic/blocking once the baseline is stable.
Check startup memory budget:
  extends: .Unit test runner
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
  script:
    - uv run python scripts/measure_startup_memory.py --label ci
  variables:
    DJANGO_SETTINGS_MODULE: waldur_core.server.base_settings
    MEMORY_BUDGET_MB: "550"
  artifacts:
    when: always
    paths:
      - scripts/memory_profiles/flamegraph-ci.html
      - scripts/memory_profiles/startup_summary.csv
      - scripts/memory_profiles/startup_components.csv
    expire_in: 1 week

Run migration tests:
  extends: .Unit test runner
  rules:
    # Skip tests if said so
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    # Always run on develop branch to ensure it's clean
    - if: '$CI_COMMIT_BRANCH == "develop"'
    # Always run on tagged releases
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    # For merge requests, only run if migration files have changed
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/migrations/*.py
  script:
    - |
      echo "[+] Setting up test database configuration..."
      cat > src/waldur_mastermind/test_settings.py <<-EOF
      from waldur_core.server.test_settings import *
      from django.db.backends.base.schema import BaseDatabaseSchemaEditor

      # Using UNLOGGED tables in PostgreSQL is a significant performance boost for
      # tests, as it reduces disk I/O by not writing to the WAL.
      BaseDatabaseSchemaEditor.sql_create_table = "CREATE UNLOGGED TABLE %(table)s (%(definition)s)"

      DATABASES = {
          'default': {
              'ENGINE': 'django.db.backends.postgresql',
              'NAME': 'test_waldur',
              'USER': 'runner',
              'HOST': 'postgres',
              'PORT': 5432,
              'PASSWORD': 'waldur',
          }
      }
      EOF
      uv run waldur migrate --noinput
  services:
    - name: "registry.hpc.ut.ee/mirror/library/postgres:15-alpine"
      alias: postgres
      command:
        [
          "postgres",
          "-cfsync=off",
          "-cfull_page_writes=off",
          "-cmax_connections=1000",
          "-cshared_buffers=1GB",
          "-ceffective_cache_size=4GB",
          "-cwork_mem=32MB",
          "-cmaintenance_work_mem=32MB",
          "-ctemp_buffers=16MB",
          "-cwal_buffers=48MB",
        ]
  variables:
    POSTGRES_DB: test_waldur
    POSTGRES_USER: runner
    POSTGRES_PASSWORD: waldur
    DJANGO_SETTINGS_MODULE: waldur_mastermind.test_settings

