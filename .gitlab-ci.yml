  script:
    - cd /tmp/
    - git clone git@github.com:waldur/go-client.git
    - cd go-client
    - git pull
    - cp $CI_PROJECT_DIR/client.go client.go
    - git add client.go
    - git commit -m "Update Waldur Go SDK" || exit 0
