      - client.go
    expire_in: 1 day

Upload Go SDK:
  stage: postdeploy
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
