Generate Ansible module changelog:
  stage: deploy
  interruptible: true
  needs:
    - Generate Ansible modules
  rules:
    # SDK release jobs require explicit opt-in via BUILD_SDK on the schedule
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_SDK != "true" && $BUILD_SDK != "yes"'
      when: never
    # Run under the same conditions as the generator job
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
  before_script:
    # We need git for cloning and jq for parsing JSON
    - apt-get update && apt-get install -y git jq
  script:
    - echo "Cloning the Ansible module repository..."
    - git clone --depth 1 --branch main https://github.com/waldur/ansible-waldur-module-next.git /tmp/ansible-module-old
    - cd /tmp/ansible-module-old

    - |
      # Determine version for changelog title and the baseline for comparison
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
        echo "This is a tagged release: $VERSION. Finding previous stable tag for comparison."

        # Fetch all tags from the remote so we have the full history
        git fetch --tags origin

        # Find the tag that comes immediately before the current one
        # 'git tag --sort=-v:refname' lists tags in descending version order
        # We find the current tag and get the next line, which is the previous tag
        PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -A 1 "$CI_COMMIT_TAG" | tail -n 1)

        if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" == "$CI_COMMIT_TAG" ]; then
          echo "Warning: Could not find a previous tag. Will compare against the initial commit."
          # Fallback: get the very first commit hash
          BASELINE_COMMIT=$(git rev-list --max-parents=0 HEAD)
        else
          echo "Found previous tag: $PREVIOUS_TAG. Using it as the baseline."
          BASELINE_COMMIT=$PREVIOUS_TAG
        fi

        # Check out the code as it was at that specific tag/commit
        git checkout $BASELINE_COMMIT

      else
        VERSION="develop"
        echo "This is a develop branch build. Comparing against the latest main branch."
        # For develop builds, we are already on the 'main' branch, so no checkout is needed.
      fi

    - cd $CI_PROJECT_DIR
    - echo "Generating changelogs for version $VERSION..."
    # Run the script and capture the JSON output
    - |
      python3 scripts/generate_ansible_changelog.py \
        /tmp/ansible-module-old/ansible_waldur_module \
        ${CI_PROJECT_DIR}/ansible_waldur_module \
        --version "$VERSION" > collection-changelogs.json
    - echo "--- Generated Changelogs (JSON) ---"
    - cat collection-changelogs.json
    - echo "-----------------------------------"

    # Build the final README for each collection by combining:
    #   1. Newly detected breaking changes (from this pipeline run)
    #   2. Previously published *release* changelogs (from the GitHub repo)
    #   3. The generator boilerplate
    #
    # Without step 2, the next pipeline would silently wipe previously
    # recorded changelogs, because the generator artifact always starts
    # with clean READMEs.
    #
    # Only versioned changelogs (e.g. "## Breaking Changes for 8.1.0")
    # are carried forward.  "develop" changelogs are transient — they
    # reflect the current diff against the last release and are
    # regenerated fresh each run, so carrying them forward would cause
    # stale entries to accumulate.
    - |
      OLD_COLLECTIONS_ROOT="/tmp/ansible-module-old/ansible_waldur_module/ansible_collections"
      NEW_COLLECTIONS_ROOT="${CI_PROJECT_DIR}/ansible_waldur_module/ansible_collections"

      # Collect all collection paths from both old and new
      ALL_COLLECTIONS=""
      for ROOT in "$OLD_COLLECTIONS_ROOT" "$NEW_COLLECTIONS_ROOT"; do
        if [ -d "$ROOT" ]; then
          for DIR in "$ROOT"/*/*; do
            [ -d "$DIR" ] || continue
            REL="${DIR#$ROOT/}"
            echo "$ALL_COLLECTIONS" | grep -qx "$REL" || ALL_COLLECTIONS="$ALL_COLLECTIONS
      $REL"
          done
        fi
      done

      for RELATIVE_PATH in $ALL_COLLECTIONS; do
        [ -z "$RELATIVE_PATH" ] && continue
        COLLECTION_NAME=$(echo "$RELATIVE_PATH" | tr '/' '.')
        NEW_README="$NEW_COLLECTIONS_ROOT/$RELATIVE_PATH/README.md"
        OLD_README="$OLD_COLLECTIONS_ROOT/$RELATIVE_PATH/README.md"

        # Get new changelog from the JSON (if any)
        NEW_CHANGELOG=""
        if [ -s "collection-changelogs.json" ] && [ "$(jq 'length' collection-changelogs.json)" -gt 0 ]; then
          CONTENT=$(jq -r ".[\"$COLLECTION_NAME\"] // empty" collection-changelogs.json)
          if [ -n "$CONTENT" ]; then
            NEW_CHANGELOG="$CONTENT"
          fi
        fi

        # Extract existing *release* changelogs from the published README.
        # Strip any "develop" sections — they are transient and will be
        # regenerated by the comparison script if still applicable.
        OLD_CHANGELOG=""
        if [ -f "$OLD_README" ] && grep -q "^## Breaking Changes for [0-9]" "$OLD_README"; then
          # Keep only lines from the first versioned changelog header
          # up to the generator boilerplate.
          OLD_CHANGELOG=$(sed -n '/^## Breaking Changes for [0-9]/,/^# Waldur Ansible Collection:/{ /^# Waldur Ansible Collection:/d; p; }' "$OLD_README")
        fi

        # Skip if there's nothing to prepend
        if [ -z "$NEW_CHANGELOG" ] && [ -z "$OLD_CHANGELOG" ]; then
          continue
        fi

        [ ! -f "$NEW_README" ] && continue

        echo "Updating README for $COLLECTION_NAME"

        # Assemble: new changelog + old changelog + generator boilerplate
        {
          if [ -n "$NEW_CHANGELOG" ]; then
            echo "$NEW_CHANGELOG"
            echo ""
            echo "---"
            echo ""
          fi
          if [ -n "$OLD_CHANGELOG" ]; then
            echo "$OLD_CHANGELOG"
          fi
          cat "$NEW_README"
        } > "${NEW_README}.tmp" && mv "${NEW_README}.tmp" "$NEW_README"
      done

  artifacts:
    paths:
      # The artifact is now the entire directory with modified READMEs
      - ansible_waldur_module/
    expire_in: 1 day

Upload Ansible module:
  stage: postdeploy
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
  rules:
    # SDK release jobs require explicit opt-in via BUILD_SDK on the schedule
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_SDK != "true" && $BUILD_SDK != "yes"'
      when: never
    # Run for both tagged releases and scheduled dev releases
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  image:
    name: registry.hpc.ut.ee/mirror/alpine/git:latest
    entrypoint: [""]
  needs:
    - Generate Ansible module changelog
  script: |
    cd /tmp/
    git clone --depth 1 --branch main git@github.com:waldur/ansible-waldur-module-next.git
    cd ansible-waldur-module-next
    # The 'ansible_waldur_module' artifact from the previous job contains the updated READMEs
    rm -rf ansible_waldur_module && cp -a "$CI_PROJECT_DIR/ansible_waldur_module/" ansible_waldur_module

    # Add all changes within the module directory (new files, modified READMEs, etc.)
    git add ansible_waldur_module/

    # Exit cleanly if there are no changes to commit
    if git diff-index --quiet HEAD --; then
      echo "No changes to commit. Exiting."
      exit 0
    fi

    if [ -n "$CI_COMMIT_TAG" ]; then
      # Stable release: commit, push code, create and push tag
      echo "Committing and tagging stable release $CI_COMMIT_TAG"
      git commit -m "Release: update modules for version $CI_COMMIT_TAG"
      git push origin main
      git tag -a $CI_COMMIT_TAG -m "Release $CI_COMMIT_TAG"
      git push origin $CI_COMMIT_TAG
    else
      # Dev release: just commit and push code, no tag
      echo "Committing development update"
      git commit -m "Update Ansible Waldur modules from develop branch"
      git push origin main
    fi
  before_script: *build_before_script

Publish Ansible Galaxy collection:
  stage: postdeploy
  interruptible: true
  rules:
    # SDK release jobs require explicit opt-in via BUILD_SDK on the schedule
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_SDK != "true" && $BUILD_SDK != "yes"'
      when: never
    # Run for both tagged releases and scheduled dev releases
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  image:
    name: registry.hpc.ut.ee/mirror/library/python:3.12-bullseye
  needs:
    - Generate Ansible modules
  before_script:
    - apt-get update && apt-get install -y jq
    - pip install yq ansible
  script:
    - echo "--- Discovering and Publishing Ansible Collections ---"

    # The root directory where collections are located, from the artifacts.
    - COLLECTIONS_ROOT="ansible_waldur_module/ansible_collections"

    # Verify that the root directory exists.
    - |
      if [ ! -d "$COLLECTIONS_ROOT" ]; then
        echo "ERROR: Collections root '$COLLECTIONS_ROOT' not found in artifacts."
        exit 1
      fi

    # 1. Discover all collections by finding all 'galaxy.yml' files.
    - |
      find "$COLLECTIONS_ROOT" -name "galaxy.yml" | while read GALAXY_FILE; do
        # For each galaxy.yml found, get its parent directory, which is the collection path.
        COLLECTION_PATH=$(dirname "${GALAXY_FILE}")

        echo "=========================================================="
        echo "Processing Collection at: ${COLLECTION_PATH}"
        echo "=========================================================="

        # 2. Dynamically determine the collection details from its galaxy.yml
        NAMESPACE=$(yq '.namespace' "${GALAXY_FILE}" | tr -d '"')
        NAME=$(yq '.name' "${GALAXY_FILE}" | tr -d '"')
        VERSION=$(yq '.version' "${GALAXY_FILE}" | tr -d '"')

        echo "Found Collection: ${NAMESPACE}.${NAME} version ${VERSION}"

        # Validate that the details were parsed correctly.
        if [ -z "$NAMESPACE" ] || [ -z "$NAME" ] || [ -z "$VERSION" ]; then
          echo "ERROR: Could not parse details from ${GALAXY_FILE}. Skipping."
          continue # Skip to the next collection in the loop
        fi

        # 3. Build the collection by changing into its directory.
        echo "--- Building collection: ${NAMESPACE}.${NAME} ---"
        ( # Start a subshell to isolate the 'cd' command
          cd "${COLLECTION_PATH}"
          ansible-galaxy collection build --force
        ) # The subshell exits, and we are back in the original directory.

        # 4. Publish the dynamically named archive file.
        #    The built archive will be located in the collection directory itself (not parent).
        ARCHIVE_FILE_NAME="${NAMESPACE}-${NAME}-${VERSION}.tar.gz"
        ARCHIVE_FILE_PATH="${COLLECTION_PATH}/${ARCHIVE_FILE_NAME}"

        echo "--- Publishing archive: ${ARCHIVE_FILE_PATH} ---"

        # Verify the archive file exists before trying to publish.
        if [ ! -f "${ARCHIVE_FILE_PATH}" ]; then
          echo "ERROR: Expected archive file not found at ${ARCHIVE_FILE_PATH}. Checking parent directory..."
          # Try parent directory as fallback
          ARCHIVE_FILE_PATH_PARENT="$(dirname "${COLLECTION_PATH}")/${ARCHIVE_FILE_NAME}"
          if [ -f "${ARCHIVE_FILE_PATH_PARENT}" ]; then
            ARCHIVE_FILE_PATH="${ARCHIVE_FILE_PATH_PARENT}"
            echo "Found archive at: ${ARCHIVE_FILE_PATH}"
          else
            echo "ERROR: Archive file not found in collection or parent directory. Skipping."
            echo "Looking for: ${ARCHIVE_FILE_NAME}"
            echo "In collection dir:"
            ls -la "${COLLECTION_PATH}/" || true
            echo "In parent dir:"
            ls -la "$(dirname "${COLLECTION_PATH}")/" || true
            continue # Skip to the next collection
          fi
        fi

        ansible-galaxy collection publish --api-key "$ANSIBLE_GALAXY_TOKEN" "${ARCHIVE_FILE_PATH}"

        echo "Successfully published ${ARCHIVE_FILE_NAME} to Ansible Galaxy."
        echo "" # Add a blank line for readability
      done

    - echo "--- All collections processed ---"

Update SDK docs generator schema:
  stage: postdeploy # Runs after the schema has been successfully generated
  image:
    name: registry.hpc.ut.ee/mirror/alpine/git:latest
    entrypoint: [""]
  needs:
    - job: Generate OpenAPI schema
      artifacts: true # This is crucial to get the schema file from the previous job
  rules:
    # SDK release jobs require explicit opt-in via BUILD_SDK on the schedule
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_SDK != "true" && $BUILD_SDK != "yes"'
      when: never
    # Run under the exact same conditions as the 'Generate OpenAPI schema' job
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  before_script:
    # No SSH setup is needed. We only need to install git and configure the user.
    - apk add --no-cache git
    - git config --global user.name "${GITLAB_USER_NAME}"
    - git config --global user.email "${GITLAB_USER_EMAIL}"
  script:
    # --- Define variables for clarity ---
    - DOCS_REPO_URL="https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/waldur/waldur-sdk-docs-generator.git"
    - DOCS_REPO_DIR="/tmp/waldur-sdk-docs-generator"
    - SOURCE_SCHEMA_PATH="${CI_PROJECT_DIR}/waldur-openapi-schema.yaml"
    - DESTINATION_SCHEMA_PATH="${DOCS_REPO_DIR}/input/openapi.yml"

    # --- Step 1: Clone the target repository using the GITLAB_TOKEN ---
    - echo "Cloning docs generator repository..."
    - git clone --depth 1 "${DOCS_REPO_URL}" "${DOCS_REPO_DIR}"

    # --- Step 2: Copy the new schema file ---
    - echo "Copying schema from ${SOURCE_SCHEMA_PATH} to ${DESTINATION_SCHEMA_PATH}"
    - cp "${SOURCE_SCHEMA_PATH}" "${DESTINATION_SCHEMA_PATH}"

    # --- Step 3: Commit and push if changes exist ---
    - cd "${DOCS_REPO_DIR}"
    - |
      # Check if there are any changes to commit.
      if [ -z "$(git status --porcelain)" ]; then
        echo "OpenAPI schema has not changed. No commit needed."
      else
        echo "Schema has changed. Committing and pushing..."

        # Determine the version for a descriptive commit message
        if [ -n "$CI_COMMIT_TAG" ]; then
          SCHEMA_VERSION="$CI_COMMIT_TAG"
        else
          # Fallback for develop branch: use the timestamp from the dev version
          SCHEMA_VERSION="develop-$(date +%Y%m%d%H%M)"
        fi

        git add input/openapi.yml
        git commit -m "feat: Update OpenAPI schema to version ${SCHEMA_VERSION} from mastermind"

        # Push to the 'main' branch of the docs generator repository
        git push origin main

        echo "Successfully pushed schema update to waldur-sdk-docs-generator."
      fi

Trigger integration tests:
  stage: validate
  trigger:
    project: waldur/waldur-integration-testing
    branch: main
    strategy: depend
  variables:
    WALDUR_MASTERMIND_IMAGE: "${CI_REGISTRY_IMAGE}:latest"
  rules:
    # Skip tests if said so
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
