Upload configuration guide:
  stage: postdeploy
  interruptible: true
  rules:
    # Skip on schedules that opt out of docs jobs (e.g. SDK-only release)
    - if: '$SKIP_DOCS == "true" || $SKIP_DOCS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
  image: registry.hpc.ut.ee/mirror/$WALDUR_MASTERMIND_TEST_IMAGE
  variables:
    DJANGO_SETTINGS_MODULE: waldur_core.server.doc_settings

  script:
    # 1. Install dependencies in the main project
    - pip install uv
    - uv sync --group dev

    # 2. Generate ALL required documentation files and store them in /tmp
    - echo "Generating documentation files..."
    - uv run waldur print_settings > ${CI_PROJECT_DIR}/docs/admin/configuration-guide.md
    - uv run waldur print_features_docs > ${CI_PROJECT_DIR}/docs/admin/features.md
    - uv run waldur print_notifications > ${CI_PROJECT_DIR}/docs/admin/notifications.md
    - uv run waldur print_commands > ${CI_PROJECT_DIR}/docs/admin/cli-guide.md
    - uv run waldur print_events > ${CI_PROJECT_DIR}/docs/events.md
    - uv run waldur print_templates > ${CI_PROJECT_DIR}/docs/admin/templates.md
    - uv run waldur print_scheduled_jobs > ${CI_PROJECT_DIR}/docs/admin/scheduled.md
    - uv run waldur print_mixins > ${CI_PROJECT_DIR}/docs/mixins.md
    - uv run waldur print_registered_handlers > ${CI_PROJECT_DIR}/docs/handlers.md

    # Generate Mermaid diagrams, outputting them to /tmp
    - >
      uv run waldur generate_mermaid structure
      -i "Customer,Project,OrganizationGroup,ProjectType,User"
      --exclude-field-types="TranslationCharField,TranslationTextField"
      -o ${CI_PROJECT_DIR}/docs/core_structure.mmd
    - >
      uv run waldur generate_mermaid permissions
      -i "User,Role,UserRole,RolePermission"
      --exclude-field-types="TranslationCharField,TranslationTextField"
      -o ${CI_PROJECT_DIR}/docs/core_permissions.mmd
    - >
      uv run waldur generate_mermaid marketplace
      -i "CategoryGroup,Category,CategoryColumn,CategoryComponent,CategoryComponentUsage"
      --exclude-field-types="TranslationCharField,TranslationTextField"
      -o ${CI_PROJECT_DIR}/docs/marketplace_category.mmd
    - >
      uv run waldur generate_mermaid marketplace
      -i "Section,Attribute,AttributeOption,Offering,OfferingComponent"
      --exclude-field-types="TranslationCharField,TranslationTextField"
      -o ${CI_PROJECT_DIR}/docs/marketplace_catalog.mmd
    - >
      uv run waldur generate_mermaid marketplace
      -i "Plan,PlanComponent,Resource,Order"
      --exclude-field-types="TranslationCharField,TranslationTextField"
      -o ${CI_PROJECT_DIR}/docs/marketplace_provision.mmd
    - echo "Generation complete. All files are in docs/."

    # 3. Commit and push the changes
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git status
    - git fetch
    - git status
    - git add docs/
    - git commit -m "Update configuration, CLI and developer guide" || exit 0
    - git push origin HEAD:${CI_COMMIT_BRANCH} || exit 0
  before_script: []

