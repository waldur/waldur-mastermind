Upload configuration guide:
  stage: postdeploy
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
  image: registry.hpc.ut.ee/mirror/$WALDUR_MASTERMIND_TEST_IMAGE
  variables:
    DJANGO_SETTINGS_MODULE: waldur_core.server.doc_settings

  script:
    # 1. Install dependencies in the main project
    - pip install uv
    - uv sync --extra dev

    # 2. Generate ALL required documentation files and store them in /tmp
    - echo "Generating documentation files..."
    - uv run waldur print_settings > ${CI_PROJECT_DIR}/docs/admin/configuration-guide.md
    - uv run waldur print_features_docs > ${CI_PROJECT_DIR}/docs/admin/features.md
    - uv run waldur print_notifications > ${CI_PROJECT_DIR}/docs/admin/notifications.md
    - uv run waldur print_commands > ${CI_PROJECT_DIR}/docs/admin/cli-guide.md
    - uv run waldur print_events > ${CI_PROJECT_DIR}/docs/events.md
    - uv run waldur print_templates > ${CI_PROJECT_DIR}/docs/admin/templates.md
    - uv run waldur print_scheduled_jobs > ${CI_PROJECT_DIR}/docs/admin/scheduled.md
    - uv run waldur print_mixins > ${CI_PROJECT_DIR}/docs/mixins.md
    - uv run waldur print_registered_handlers > ${CI_PROJECT_DIR}/docs/handlers.md

    # Generate Mermaid diagrams, outputting them to /tmp
    - >
      uv run waldur generate_mermaid structure
      -i "Customer,Project,OrganizationGroup,ProjectType,User"
      --exclude-field-types="TranslationCharField,TranslationTextField"
      -o ${CI_PROJECT_DIR}/docs/core_structure.mmd
    - >
      uv run waldur generate_mermaid permissions
      -i "User,Role,UserRole,RolePermission"
      --exclude-field-types="TranslationCharField,TranslationTextField"
      -o ${CI_PROJECT_DIR}/docs/core_permissions.mmd
    - >
      uv run waldur generate_mermaid marketplace
      -i "CategoryGroup,Category,CategoryColumn,CategoryComponent,CategoryComponentUsage"
      --exclude-field-types="TranslationCharField,TranslationTextField"
      -o ${CI_PROJECT_DIR}/docs/marketplace_category.mmd
    - >
      uv run waldur generate_mermaid marketplace
      -i "Section,Attribute,AttributeOption,Offering,OfferingComponent"
      --exclude-field-types="TranslationCharField,TranslationTextField"
      -o ${CI_PROJECT_DIR}/docs/marketplace_catalog.mmd
    - >
      uv run waldur generate_mermaid marketplace
      -i "Plan,PlanComponent,Resource,Order"
      --exclude-field-types="TranslationCharField,TranslationTextField"
      -o ${CI_PROJECT_DIR}/docs/marketplace_provision.mmd
    - echo "Generation complete. All files are in docs/."

    # 3. Commit and push the changes
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git status
    - git fetch
    - git status
    - git add docs/
    - git commit -m "Update configuration, CLI and developer guide" || exit 0
    - git push origin HEAD:${CI_COMMIT_BRANCH} || exit 0
  before_script: []

Upload MCP metadata:
  stage: postdeploy
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
  image: registry.hpc.ut.ee/mirror/$WALDUR_MASTERMIND_TEST_IMAGE
  variables:
    DJANGO_SETTINGS_MODULE: waldur_core.server.doc_settings
  script:
    - pip install uv
    - uv sync --extra dev
    - uv run waldur export_model_metadata > /tmp/meta.yaml
    - cd /tmp/
    - git clone "https://mastermind:$MCP_ACCESS_TOKEN@$CI_SERVER_HOST/waldur/waldur-mcp-server.git"
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - cd waldur-mcp-server
    - git checkout main
    - mv /tmp/meta.yaml src/waldur_mcp_server/meta.yaml
    - git add src/waldur_mcp_server/meta.yaml
    - git commit -m "Update metadata" || exit 0
    - git branch new-metadata
    - git push --set-upstream origin new-metadata:main
  before_script: []

Generate OpenAPI schema:
  stage: deploy
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  image: registry.hpc.ut.ee/mirror/$WALDUR_MASTERMIND_TEST_IMAGE
  variables:
    DJANGO_SETTINGS_MODULE: waldur_core.server.doc_settings
  before_script:
    # Ensure the CI runner has all tags from the remote repository
    - git fetch --tags
  script:
    - pip install uv
    - uv sync --extra dev

    # Determine the release version based on the trigger
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # This is a stable, tagged release. The version is the tag itself.
        RELEASE_VERSION="$CI_COMMIT_TAG"
        echo "Building OpenAPI schema for stable release version: $RELEASE_VERSION"
      else
        # This is a dev release from a schedule.
        # Find the latest tag to use as a base for the pre-release version.
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        RELEASE_VERSION="${LATEST_TAG}-dev.${TIMESTAMP}"
        echo "Latest stable tag found: $LATEST_TAG"
        echo "Building OpenAPI schema for development release version: $RELEASE_VERSION"
      fi

    # Generate the schema, injecting the dynamic version
    - uv run waldur spectacular --api-version "$RELEASE_VERSION" --file waldur-openapi-schema.yaml --fail-on-warn
    - echo "Successfully generated OpenAPI schema with version $RELEASE_VERSION"
  artifacts:
    paths:
      - waldur-openapi-schema.yaml
    expire_in: 1 day

Generate TypeScript SDK:
  stage: deploy
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
  image: registry.hpc.ut.ee/mirror/library/node:lts-alpine
  needs:
    - Generate OpenAPI schema
  script: |
    npx --yes @hey-api/openapi-ts@0.77.0
    # drop querySerializer because it is producing explode: false for multiple choice filter
    sed -i '/querySerializer: {/,/},/d' waldur-typescript-sdk/sdk.gen.ts
    sed -i '1i export { formDataBodySerializer, RequestResult } from "./client";' waldur-typescript-sdk/index.ts
  artifacts:
    paths:
      - waldur-typescript-sdk/
    expire_in: 1 day

Generate Python SDK:
  stage: deploy
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
  image: registry.hpc.ut.ee/mirror/library/python:3.11-bullseye
  needs:
    - Generate OpenAPI schema
  script: |
    pip install git+https://github.com/waldur/openapi-python-client.git
    openapi-python-client generate --path waldur-openapi-schema.yaml --output-path py-client --overwrite --meta poetry
  artifacts:
    paths:
      - py-client/
    expire_in: 1 day

Generate Go SDK:
  stage: deploy
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
  image: registry.hpc.ut.ee/mirror/library/golang:tip-alpine
  needs:
    - Generate OpenAPI schema
  script: |
    go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
    oapi-codegen --package client --generate types,client -o client.go waldur-openapi-schema.yaml
    ls -l client.go
  artifacts:
    paths:
      - client.go
    expire_in: 1 day

Generate Terraform SDK:
  stage: deploy
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
  image: registry.hpc.ut.ee/mirror/library/golang:tip-alpine
  needs:
    - Generate OpenAPI schema
  script: |
    go install github.com/hashicorp/terraform-plugin-codegen-openapi/cmd/tfplugingen-openapi@latest
    go install github.com/hashicorp/terraform-plugin-codegen-framework/cmd/tfplugingen-framework@latest
    tfplugingen-openapi generate --output waldur-terraform-provider-spec.json --config terraform-generator-config.yaml waldur-openapi-schema.yaml
    tfplugingen-framework generate all --input waldur-terraform-provider-spec.json --output terraform-sdk/
  artifacts:
    paths:
      - terraform-sdk/
    expire_in: 1 day

Upload Go SDK:
  stage: postdeploy
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "schedule"'
  image:
    name: registry.hpc.ut.ee/mirror/alpine/git:latest
    entrypoint: [""]
  needs:
    - Generate Go SDK
  script:
    - cd /tmp/
    - git clone git@github.com:waldur/go-client.git
    - cd go-client
    - git pull
    - cp $CI_PROJECT_DIR/client.go client.go
    - git add client.go
    - git commit -m "Update Waldur Go SDK" || exit 0
