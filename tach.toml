# Tach module boundary configuration for waldur-mastermind.
# See docs/guides/modularization.md for workflow, architecture layers, and rollout phases.
#
# Phase 1 (active): Baseline frozen across all packages under src/.
#   - Every module is registered and root_module = "forbid" prevents untracked packages.
#   - exact = true prevents stale dependencies from remaining in tach.toml.
#   - ignore_type_checking_imports = false and include_string_imports = true catch
#     TYPE_CHECKING and Django string-import bypasses.
#   - Upward dependencies (violating the target layer order) are marked with inline
#     comments and should be burned down before enabling `layers` in Phase 4.
#
# Target layers (top to bottom; enabled in Phase 4 once upward cycles are broken):
# layers = [
#     "composition",   # waldur_core.server, waldur_mastermind.demo_presets
#     "integrations",  # auth, cloud/compute providers, marketplace_* bridges
#     "supporting",    # invoices, billing, proposal, policy, support, chat, ...
#     "marketplace",   # marketplace, marketplace_metrics
#     "tenancy",       # structure, quotas, users, onboarding, checklist, changelog
#     "kernel",        # core, permissions, logging, configuration, media, common
# ]

source_roots = ["src"]
root_module = "forbid"
exact = true
ignore_type_checking_imports = false
include_string_imports = true
exclude = [
    "**/migrations/",
    "**/tests/",
    "docs/",
    "scripts/",
    "tests/",
    "docker/",
]

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"

