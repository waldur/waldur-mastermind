## Clustering
cluster_partition_handling = ignore

## Defaults
# During the first start, RabbitMQ will create a vhost and a user
# These config items control what gets created
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*
log.console = true
default_vhost = /
default_user = $(RABBITMQ_USERNAME)
default_pass = $(RABBITMQ_PASSWORD)

## Networking
listeners.tcp.default = 5672

## Management
management.tcp.ip = 0.0.0.0
management.tcp.port = 15672
loopback_users = none

## Resource limits
# Set a free disk space limit to 1GB. When below this limit, RabbitMQ will stop accepting new connections.
disk_free_limit.absolute = 1GB

## RabbitMQ 4.3 compatibility
# RabbitMQ 4.3 denies transient, non-exclusive queues by default, which is the
# combination kombu's pidbox and Celery's gossip queues used to declare.
# Mastermind now declares both as exclusive (CELERY_CONTROL_QUEUE_EXCLUSIVE /
# CELERY_EVENT_QUEUE_EXCLUSIVE in celery_settings.py), so this permit flag is
# no longer required for current builds. It is kept as a safety net for
# pointing an older mastermind image at this broker. The flag is read at node
# boot and is accepted on 4.1, 4.2 and 4.3 alike, so it can be set or removed
# at any point in the version walk.
deprecated_features.permit.transient_nonexcl_queues = true
