repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: check-yaml
        files: ^src/|docker/

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-format
      - id: ruff-check
        args:
          - --fix
          - --unsafe-fixes
          - --exit-non-zero-on-fix
        files: ^src/,^scripts/
        exclude: src/waldur_core/server/base_settings.py

  - repo: local
    hooks:
      - id: migrations
        name: migrations with auto-generated names
        entry: migrations must not be with auto-generated names
        language: fail
        files: '^.*/migrations/\d{4}_auto_\d{8}_\d{4}.py$'

      - id: mermaid-validate
        name: validate mermaid diagrams
        description: |
          Parse mermaid code blocks in Markdown and standalone .mmd files using
          @probelabs/maid.

          Excluded:
          - docs/*.mmd standalone files containing classDiagram (Maid
            currently only supports flowchart, pie, sequence — its
            classDiagram parser raises false-positive 'missing }' errors)
          - docs/models.md uses mkdocs ``{% include-markdown %}`` directives
            inside mermaid fences which Maid cannot resolve
        entry: maid
        language: node
        files: '\.(md|markdown|mdx|mmd|mermaid)$'
        exclude: |
          (?x)^docs/(
            .*\.mmd|
            models\.md
          )$
        additional_dependencies:
          - '@probelabs/maid@0.0.29'
