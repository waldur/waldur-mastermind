worker_processes auto;
pcre_jit on;

# Redirect logs to stderr/stdout for container compatibility
error_log stderr warn;
pid /tmp/nginx.pid;

# Includes files with directives to load dynamic modules.
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    # Includes mapping of file name extensions to MIME types of responses
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security settings
    server_tokens off;
    client_max_body_size 1m;

    # Performance settings
    sendfile on;
    tcp_nopush on;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Strong SSL ciphers
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Compression settings
    gzip_vary on;

    # WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Custom log format for the application
    log_format custom 'NGINX: $remote_addr - [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$gzip_ratio"';

    # Application server configuration
    server {
        listen 80;
        server_name mastermind;
        access_log /dev/stdout custom;
        error_log /dev/stderr;

        # Temp paths for OpenShift compatibility
        client_body_temp_path /var/lib/nginx/tmp/client_body;
        proxy_temp_path /var/lib/nginx/tmp/proxy;
        fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
        uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
        scgi_temp_path /var/lib/nginx/tmp/scgi;

        location / {
            include /etc/nginx/proxy.conf;
        }

        location /api/proposal-protected-calls {
            client_max_body_size 10M;
            include /etc/nginx/proxy.conf;
        }

        location /api/proposal-proposals {
            client_max_body_size 10M;
            include /etc/nginx/proxy.conf;
        }

        location /api/support-attachments {
            client_max_body_size 10M;
            include /etc/nginx/proxy.conf;
        }

        location /static {
            alias /usr/share/waldur/static/;
            add_header Cache-Control "public, max-age=3153600";
        }
    }
}
