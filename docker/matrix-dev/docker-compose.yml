services:
  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel:v1.9.3
    restart: unless-stopped
    # Loopback only: tuwunel.toml allows open registration with a public token.
    ports:
      - "127.0.0.1:6167:6167"
    volumes:
      - tuwunel-data:/var/lib/tuwunel
      - ./tuwunel.toml:/etc/tuwunel.toml:ro
    environment:
      TUWUNEL_CONFIG: /etc/tuwunel.toml

  # Waldur issues the call tokens itself (/api/matrix/livekit, advertised in
  # tuwunel.toml), signing them with the key below; dev_matrix_settings seeds
  # the same key, secret and URLs.
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    # Published on loopback only: the dev keys below are public. LiveKit
    # advertises node_ip 127.0.0.1 as its ICE candidate, so a browser on the
    # same machine reaches the media ports there; a browser on another host
    # never could, binding or not.
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: [""]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: 127.0.0.1
        keys:
          devkey: devsecret

volumes:
  tuwunel-data:
